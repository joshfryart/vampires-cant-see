<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JS reference shots</title>
<style>
  body { margin: 0; background: #000; color: #9ab; font: 12px monospace; }
  canvas { display: block; width: 1280px; height: 720px; image-rendering: auto; }
  #log { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 4px 8px; }
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div id="log">loading</div>
<!--
  Renders the Godot port's reference scenes with the ORIGINAL js/render.js (read only), so shots can sit next to the
  Godot ones. Same setup as project/tests/scenarios/villager_test.gd and ping_test.gd: 60 fps fixed steps, the same
  ping frames, Forge and Schedule not loaded (the Godot slice uses the plain look), effects 0.
  Query: ?scene=villager|ping  &frames=42,60,120,192 (frame numbers to capture)  &save=1 (POST each shot to /save)
-->
<script src="/html-version/js/log.js"></script>
<script src="/html-version/js/flags.js"></script>
<script src="/html-version/js/data/maps.js"></script>
<script src="/html-version/js/data/sounds.js"></script>
<script src="/html-version/js/world.js"></script>
<script src="/html-version/js/raycast.js"></script>
<script src="/html-version/js/sonar.js"></script>
<script src="/html-version/js/ripple.js"></script>
<script src="/html-version/js/people.js"></script>
<script src="/html-version/js/render.js"></script>
<script>
(function () {
  const VCS = window.VCS;
  const q = new URLSearchParams(location.search);
  const scene = q.get('scene') || 'villager';
  const frames = (q.get('frames') || '42,60,120,192').split(',').map(Number);
  const save = q.get('save') === '1';
  const logEl = document.getElementById('log');
  const say = (s) => { logEl.textContent = s; };
  VCS.Log.setConsole(false);
  VCS.Flags.register('vis.vessels', false, 'Circulatory pulse on villagers');

  const canvas = document.getElementById('c');
  const r = VCS.Render.create(canvas, { effects: 0 });
  r.reduced = false;
  const def = VCS.MapData.maps.test;
  const world = VCS.World.load(def, { requireStart: true });
  const sonar = VCS.Sonar.create();
  const people = VCS.People.create(world, def, { seed: 1 });
  const player = scene === 'ping' ? { x: world.start.x, y: world.start.y, angle: 0 } : { x: 11.5, y: 4.5, angle: 0 };
  const pingFrames = scene === 'ping' ? [1] : [30, 180];
  const react = (VCS.SoundData.react);
  const ctxBase = { player: player, playerLit: 0, react: Object.assign({}, react, { dazedTime: 3 }), grace: 0, nightFrac: 0, nightSec: 0, fear: 0 };
  const DT = 1 / 60;
  let clock = 0;
  const last = Math.max.apply(null, frames);
  const shots = {};

  function post(name, url) {
    return fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: url });
  }

  async function run() {
    for (let f = 1; f <= last; f++) {
      clock += DT;
      if (pingFrames.indexOf(f) >= 0) {
        const room = VCS.SoundData.rooms[world.kind];
        const keep = { range: sonar.range, bounces: sonar.bounces, fade: sonar.fade };
        sonar.range = 10 * room.rangeMul; sonar.bounces = Math.min(2, room.bounceCap); sonar.fade = 3 * room.fadeMul;
        VCS.Sonar.emit(sonar, world, player.x, player.y, clock, { z: 0.62, facing: player.angle });
        sonar.range = keep.range; sonar.bounces = keep.bounces; sonar.fade = keep.fade;
        VCS.People.react(people, player.x, player.y, 'ping', ctxBase, VCS.SoundData.react.startleDist);
        VCS.People.drainEvents(people);
      }
      VCS.Sonar.prune(sonar, clock);
      const tPrev = clock - DT;
      VCS.People.update(people, world, DT, ctxBase);
      VCS.People.drainEvents(people);
      VCS.People.updateEchoes(people, sonar, tPrev, clock);
      if (frames.indexOf(f) >= 0) {
        VCS.Render.drawFirstPerson(r, world, player, sonar, clock, { people: people, lit: 0 });
        const url = canvas.toDataURL('image/png');
        shots[f] = url.length;
        if (save) await post(scene + '_f' + String(f).padStart(4, '0'), url);
        say('frame ' + f + ' captured (' + url.length + ' bytes)');
      }
    }
    window.__done = { scene, frames, shots };
    say('done: ' + JSON.stringify(window.__done));
  }
  run().catch((e) => { say('error: ' + e.message); window.__error = String(e && e.stack || e); });
})();
</script>
</body>
</html>
